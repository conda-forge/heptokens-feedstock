schema_version: 1

context:
  version: "0.2.0"

package:
  name: heptokens
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/h/heptokens/heptokens-${{ version }}.tar.gz
  sha256: 5d75df706258085b5a3a04fdbe9fef805113e83011df8c082a8febccf53b9fcf

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - heptokens-train = heptokens.train:main
      - heptokens-export = heptokens.export_tokens:main
      - heptokens-fit-preprocessors = heptokens.fit_preprocessors:main

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - pytorch >=2.4
    - lightning >=2.5
    - omegaconf >=2.3
    - hydra-core >=1.3
    - h5py >=3.13
    - scikit-learn >=1.3
    - vector-quantize-pytorch
    - awkward >=2.8
    - uproot >=5.7
    - rich >=14
    - wandb >=0.22.3,<0.23

tests:
  - python:
      imports:
        - heptokens
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - heptokens-train --help
      - heptokens-export --help
      - heptokens-fit-preprocessors --help

about:
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/Treasure-AmSC/heptokens
  summary: Tokenization library for high-energy physics events
  repository: https://github.com/Treasure-AmSC/heptokens

extra:
  recipe-maintainers:
    - sambklein
    - jeffkrupa
    - makagan
